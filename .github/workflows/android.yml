name: Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_x86:
        description: "Добавить x86_64 (для эмулятора; в релиз не нужен)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Test mihomo core
        working-directory: core
        run: go test -tags with_gvisor,cmfa ./...

      - name: Build mihomo core .aar
        working-directory: core
        run: |
          go mod download
          TARGETS="android/arm64,android/arm"
          if [ "${{ github.event.inputs.include_x86 }}" = "true" ]; then
            TARGETS="$TARGETS,android/amd64"
          fi
          echo "targets: $TARGETS"
          gomobile bind -v \
            -target="$TARGETS" \
            -androidapi 21 \
            -tags with_gvisor,cmfa \
            -ldflags="-s -w -extldflags=-Wl,-z,max-page-size=16384" \
            -o mihomo.aar .
          mkdir -p ../android/app/libs
          cp mihomo.aar ../android/app/libs/mihomo.aar

      - name: Sync web assets + native plugin config into android project
        working-directory: .
        run: |
          npm install
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/misetanibox-release.p12" \
            -storetype PKCS12 \
            -alias misetanibox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass misetanibox123 -keypass misetanibox123 \
            -dname "CN=Misetanibox, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=RU"

      - name: Build release APK (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/misetanibox-release.p12
          ANDROID_KEYSTORE_PASSWORD: misetanibox123
          ANDROID_KEY_ALIAS: misetanibox
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Misetanibox_android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Misetanibox_android
          path: Misetanibox_android.apk
          retention-days: 14
