name: Generate Release Keystore (run once)
on:
  workflow_dispatch: {}
jobs:
  make-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore misetanibox-release.p12 \
            -storetype PKCS12 \
            -alias misetaniboxfork \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass misetaniboxfork -keypass misetaniboxfork \
            -dname "CN=Misetanibox, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=RU"
          base64 -w0 misetanibox-release.p12 > misetanibox-release.p12.b64
      - name: Upload as artifact (not printed to logs, so it doesn't leak)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-base64
          path: misetanibox-release.p12.b64
          retention-days: 1
